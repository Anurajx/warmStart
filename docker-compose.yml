services:
  redis:
    image: redis/redis-stack-server:7.4.0-v1
    container_name: warmstart-redis
    ports:
      - "6379:6379"
    volumes:
      - warmstart-redis-data:/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: warmstart-backend
    env_file: ./backend/.env
    environment:
      WARMSTART_REDIS_HOST: redis
      WARMSTART_REDIS_PORT: "6379"
      WARMSTART_ENABLE_LLM_JUDGE: "false"
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000/api
    container_name: warmstart-frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  warmstart-redis-data: